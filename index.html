<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fouad & Lea's Wedding</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet">

  <!-- preload background -->
  <link rel="preload" as="image" href="fouad_lea.jpeg">

  <style>
    :root{
      --gold:#c5a059;
      --gold2:#e3c77f;
      --text:#2f2f2f;
      --muted:#6f6f6f;
      --shadow: 0 16px 46px rgba(0,0,0,0.18);
      --card: rgba(255,255,255,0.78);
      --border: rgba(197,160,89,0.26);
      --radius: 26px;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: "Cormorant Garamond", serif;
      background:#000;
      overflow-x:hidden;
    }

    /* BACKGROUND */
    .bg{
      position:fixed;
      inset:0;
      background-image:url("fouad_lea.jpeg");
      background-size:cover;
      background-position:center;
      z-index:0;
      opacity:0;
      transition:opacity 1s ease;
    }
    .bg.loaded{ opacity:1; }

    .bg:after{
      content:"";
      position:absolute;
      inset:0;
      background: radial-gradient(circle, rgba(255,255,255,0.25), rgba(0,0,0,0.2));
    }

    /* FLOATING HEARTS */
    .floating-hearts{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:9999;
    }
    .tiny-heart{
      position:absolute;
      color:#ff4b6e;
      animation: floatUp 1.8s ease-out forwards;
      opacity:0;
    }
    @keyframes floatUp{
      0%{ transform:translate(0,0) scale(0.6); opacity:0; }
      20%{ opacity:1; }
      100%{ transform:translate(var(--x), var(--y)) scale(1.2); opacity:0; }
    }

    /* OVERLAY */
    #envelope-overlay{
      position:fixed;
      inset:0;
      display:flex;
      justify-content:center;
      align-items:center;
      z-index:9999;
      transition:opacity .8s ease, transform .8s ease;
    }

    .hidden-overlay{
      opacity:0;
      pointer-events:none;
      transform:scale(0.98);
    }

    .overlay-card{
      width:min(520px, 92vw);
      background:rgba(255,255,255,0.85);
      border-radius:28px;
      text-align:center;
      padding:20px;
      box-shadow:var(--shadow);
    }

    .overlay-title{
      font-family:"Great Vibes", cursive;
      font-size:48px;
      color:var(--gold);
    }

    /* HEART */
    .wax-seal-heart{
      width:160px;
      margin:auto;
      cursor:pointer;
    }

    /* CONTENT */
    .content{
      position:relative;
      z-index:1;
      padding:40px 16px;
      opacity:0;
      transform:translateY(20px);
      transition:1s ease;
      display:none;
    }
    .show-content{
      display:block;
      opacity:1;
      transform:translateY(0);
    }

    .container{ width:min(600px,92vw); margin:auto; }

    .hero{
      background:var(--card);
      border-radius:var(--radius);
      padding:20px;
      text-align:center;
    }

    h1{
      font-family:"Great Vibes", cursive;
      font-size:60px;
      color:var(--gold);
      margin:0;
    }

    .countdown{
      display:flex;
      justify-content:center;
      gap:10px;
      margin-top:10px;
    }

    .time-box{
      background:white;
      padding:10px;
      border-radius:12px;
      min-width:70px;
    }

    .card{
      margin-top:12px;
      background:var(--card);
      padding:16px;
      border-radius:var(--radius);
      opacity:0;
      transform:translateY(20px);
      transition:.8s ease;
    }

    .card.reveal{ opacity:1; transform:translateY(0); }

    /* RSVP */
    .rsvp{
      margin-top:12px;
      background:var(--card);
      padding:16px;
      border-radius:var(--radius);
      opacity:0;
      transform:translateY(20px);
      transition:.8s ease;
    }
    .rsvp.reveal{ opacity:1; transform:translateY(0); }

    input, select, button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:12px;
      border:1px solid #ddd;
      font-family:inherit;
    }

    button{
      background:linear-gradient(135deg,var(--gold),var(--gold2));
      color:white;
      border:none;
      cursor:pointer;
      font-weight:bold;
    }

    #successMessage{
      opacity:0;
      transform:translateY(10px);
      transition:.6s ease;
      text-align:center;
      margin-top:10px;
      color:var(--gold);
    }
    #successMessage.show{
      opacity:1;
      transform:translateY(0);
    }

    /* reduced motion */
    @media (prefers-reduced-motion: reduce){
      *{ animation:none !important; transition:none !important; }
    }
  </style>
</head>

<body>

<div class="bg"></div>
<div class="floating-hearts" id="floatingHearts"></div>

<!-- OPENING -->
<div id="envelope-overlay">
  <div class="overlay-card">
    <div class="overlay-title">Fouad & Lea</div>

    <div class="wax-seal-heart" id="openBtn">
      ❤️ Tap to Open
    </div>
  </div>
</div>

<!-- END OVERLAY -->
<div id="end-overlay"></div>

<!-- CONTENT -->
<div class="content" id="main-content">
  <div class="container">

    <div class="hero">
      <h1>Fouad & Lea</h1>

      <div class="countdown" id="timer">
        <div class="time-box"><span id="days">00</span></div>
        <div class="time-box"><span id="hours">00</span></div>
        <div class="time-box"><span id="mins">00</span></div>
        <div class="time-box"><span id="secs">00</span></div>
      </div>
    </div>

    <div class="card reveal-on-scroll">
      <h3>Location</h3>
      <p>Notre Dame des Dons</p>
    </div>

    <div class="card reveal-on-scroll">
      <h3>Reception</h3>
      <p>Atlal Plaza</p>
    </div>

    <div class="rsvp reveal-on-scroll">
      <h3>RSVP</h3>

      <form id="rsvpForm">
        <input type="text" name="Name" placeholder="Full Name" required>
        <select name="Guests">
          <option>1</option>
          <option>2</option>
          <option>3</option>
        </select>
        <button id="submitBtn">Confirm</button>
      </form>

      <div id="successMessage">We can’t wait to see you ✨</div>
    </div>

  </div>
</div>

<script>
const scriptURL = "YOUR_GOOGLE_SCRIPT_URL";

let opened = false;
let submitting = false;

/* bg fade in */
window.addEventListener("load", () => {
  document.querySelector(".bg").classList.add("loaded");
});

/* OPEN */
document.getElementById("openBtn").addEventListener("pointerup", openInvite);

function openInvite(){
  if(opened) return;
  opened = true;

  document.getElementById("envelope-overlay").classList.add("hidden-overlay");

  setTimeout(() => {
    document.getElementById("main-content").classList.add("show-content");
    initReveal();
  }, 700);
}

/* hearts */
function hearts(x,y){
  const c = document.getElementById("floatingHearts");
  for(let i=0;i<15;i++){
    const h=document.createElement("div");
    h.className="tiny-heart";
    h.innerHTML="♥";
    h.style.left=x+"px";
    h.style.top=y+"px";
    h.style.setProperty("--x",(Math.random()*200-100)+"px");
    h.style.setProperty("--y",(-Math.random()*200)+"px");
    c.appendChild(h);
    setTimeout(()=>h.remove(),2000);
  }
}

/* reveal */
function initReveal(){
  const obs = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting) e.target.classList.add("reveal");
    });
  },{threshold:0.15});

  document.querySelectorAll(".reveal-on-scroll")
    .forEach(el=>obs.observe(el));
}

/* RSVP */
document.getElementById("rsvpForm").addEventListener("submit", async e=>{
  e.preventDefault();
  if(submitting) return;
  submitting = true;

  const btn=document.getElementById("submitBtn");
  btn.disabled=true;

  try{
    await fetch(scriptURL,{method:"POST",body:new FormData(e.target)});
    document.getElementById("successMessage").classList.add("show");
    e.target.style.display="none";
  }catch(err){
    alert("Error submitting RSVP");
  }

  submitting=false;
});

/* countdown */
const date = new Date("2026-11-01T17:00:00").getTime();
setInterval(()=>{
  const d = date - Date.now();
  document.getElementById("days").textContent = Math.floor(d/86400000);
  document.getElementById("hours").textContent = Math.floor(d%86400000/3600000);
  document.getElementById("mins").textContent = Math.floor(d%3600000/60000);
  document.getElementById("secs").textContent = Math.floor(d%60000/1000);
},1000);
</script>

</body>
</html>
